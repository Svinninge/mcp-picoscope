<!doctype html>
<!-- File version: v0.11 -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoScope</title>
<style>
  /* The page is read on a 300 %-scaled Windows display, so nothing here is
     sized in absolute pixels that assume a desktop-sized window. Two mechanisms
     carry that: a user-set zoom (remembered per browser) and breakpoints that
     drop the lowest-value content first as the window shrinks. */
  :root {
    --bg: #0d1117; --panel: #151b23; --line: #2a3441;
    --ink: #e6edf3; --dim: #8b98a5; --trace: #3fe08f;
    --warn: #f0a13a; --bad: #f05a5a; --ok: #3fe08f;
    --pad: 12px; --gap: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--line); color: var(--ink);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr minmax(220px, 300px);
    grid-template-rows: auto 1fr;
    /* Height is set in script, not as 100vh: vh units are measured before the
       zoom is applied, so at 70 % the page would lay out 1/0.7 times too tall —
       empty space below the fold, and the trace's zero line pushed off centre
       because the canvas wrapper extends past the visible area. */
    height: 100vh; gap: 1px;
  }
  header {
    grid-column: 1 / -1; background: var(--panel);
    display: flex; align-items: center; gap: 10px;
    padding: 6px var(--pad); flex-wrap: nowrap; overflow: hidden;
  }
  h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
  .pill {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.live { color: var(--ok); border-color: var(--ok); }
  .pill.sim { color: var(--warn); border-color: var(--warn); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .spacer { flex: 1 1 auto; min-width: 0; }
  .zoom { display: flex; gap: 2px; flex: 0 0 auto; }
  .zoom button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; width: 24px; height: 22px; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0;
  }
  .zoom button:hover { border-color: var(--dim); }
  .zoom button.wide { width: auto; padding: 0 7px; font-size: 11px; }
  .action {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 12px; cursor: pointer; font-size: 12px;
    flex: 0 0 auto;
  }
  .action:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
  .action:disabled { opacity: .45; cursor: default; }
  .action.on { border-color: var(--ok); color: var(--ok); }
  .sweep { display: flex; gap: 4px; flex: 0 0 auto; }
  .sweep .action { padding: 2px 8px; }
  #screen.dragging { cursor: ns-resize; }

  main {
    background: var(--bg); padding: var(--pad); display: flex;
    flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0;
    overflow: hidden;
  }
  /* The canvas takes its size from this wrapper, never the other way round:
     writing canvas.height sets the element's intrinsic size, and a bare
     flex:1 canvas then grows the column on every resize until the readouts are
     pushed off screen. */
  .screenwrap { flex: 1 1 auto; min-height: 80px; position: relative; }
  #screen {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    background: #070b10; border: 1px solid var(--line); border-radius: 4px;
  }
  .divs { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .readouts { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; }
  .readout {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 9px; min-width: 88px; flex: 1 1 auto;
  }
  .readout .k {
    font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .4px; white-space: nowrap;
  }
  .readout .v { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  aside {
    background: var(--panel); padding: var(--pad); overflow: auto;
    display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  section { min-width: 0; }
  section h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--dim); margin: 0 0 4px; font-weight: 600;
  }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 0; font-size: 12px; }
  dt { color: var(--dim); white-space: nowrap; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .note { color: var(--warn); font-size: 11px; flex: 0 0 auto; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 11px; }
  li { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px solid var(--line); }
  li .t { color: var(--dim); font-variant-numeric: tabular-nums; }
  li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.err .n { color: var(--bad); }
  .empty { color: var(--dim); font-style: italic; }

  /* Shrinking order, lowest value first: the activity log, then the settings
     panel, then the secondary readouts. The trace and the range it was taken
     on are the last things to go, because a curve without its scale is not a
     measurement. */
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside { flex-direction: row; flex-wrap: wrap; gap: 16px; max-height: 34vh; }
    #device, #version { display: none; }
  }
  @media (max-width: 560px) { #activity-section { display: none; } }
  @media (max-width: 440px) { .readout.p3 { display: none; } }
  @media (max-width: 620px) { #normal, #single { display: none; } }
  @media (max-width: 400px) { .action, .sweep { display: none; } }
  @media (max-width: 340px) { .readout.p2, aside { display: none; } }
  @media (max-height: 460px) { .divs { display: none; } .readout .v { font-size: 14px; } }
  @media (max-height: 340px) { .readouts { display: none; } }
</style>
</head>
<body>
<header>
  <h1>PicoScope</h1>
  <span class="pill off" id="status">ingen enhet</span>
  <span class="pill" id="device">—</span>
  <div class="spacer"></div>
  <span class="pill" id="version">—</span>
  <span class="pill" id="clock">—</span>
  <button id="autoset" class="action" title="Välj område och tidbas som visar signalen">Autoset</button>
  <div class="sweep">
    <button id="run" class="action" title="Svep kontinuerligt (auto)">Run</button>
    <button id="normal" class="action" title="Svep bara på riktig trigg">Normal</button>
    <button id="single" class="action" title="Ett enda svep">Single</button>
    <button id="stop" class="action" title="Stoppa svepet">Stop</button>
    <button id="slope" class="action" title="Triggflank">↑</button>
  </div>
  <div class="zoom">
    <button id="zoom-out" title="Mindre (Ctrl+-)">−</button>
    <button id="zoom-reset" class="wide" title="Återställ zoom">100%</button>
    <button id="zoom-in" title="Större (Ctrl++)">+</button>
  </div>
</header>

<main>
  <div class="screenwrap"><canvas id="screen"></canvas></div>
  <div class="divs" id="divs">—</div>
  <div class="note" id="capnote"></div>
  <div class="readouts" id="readouts"></div>
</main>

<aside>
  <section>
    <h2>Kanal A</h2>
    <dl id="channel"></dl>
  </section>
  <section>
    <h2>Trigg</h2>
    <dl id="trigger"></dl>
  </section>
  <section id="activity-section">
    <h2>MCP-aktivitet</h2>
    <ul id="activity"><li class="empty">väntar på anrop…</li></ul>
  </section>
</aside>

<script>
const GRID_X = 10, GRID_Y = 8;
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
let latest = null;

// -- zoom -----------------------------------------------------------------
// The host display runs at 300 % scaling, so the browser's own idea of a
// comfortable size is three times too big for a glanceable window. This scales
// the whole page and remembers the choice per browser; the canvas backing
// store follows, or the trace would go soft at anything but 100 %.
const SCALE_KEY = "picoscope-ui-scale";
const SCALE_MIN = 0.4, SCALE_MAX = 2.0, SCALE_STEP = 0.1;
let scale = 1;
let scaleFromServer = false;

function readScale() {
  // localStorage is the fast path only. It is keyed per origin, and the port
  // changes when another process already owns 8071 — so the server's copy is
  // the one that actually survives. The first /state reply overrides this.
  try {
    const v = parseFloat(localStorage.getItem(SCALE_KEY));
    return Number.isFinite(v) ? Math.min(SCALE_MAX, Math.max(SCALE_MIN, v)) : 1;
  } catch (e) { return 1; }
}

function sizeToViewport() {
  // innerHeight is in unzoomed CSS pixels; dividing by the zoom gives the
  // height the body must claim to cover exactly one screen after scaling.
  document.body.style.height = (window.innerHeight / scale) + "px";
  document.body.style.width = (window.innerWidth / scale) + "px";
}

function applyScale(next) {
  scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(next * 100) / 100));
  document.documentElement.style.zoom = scale;
  document.getElementById("zoom-reset").textContent = Math.round(scale * 100) + "%";
  try { localStorage.setItem(SCALE_KEY, String(scale)); } catch (e) { /* private mode */ }
  sizeToViewport();
  fit();
}

// -- remembering the window ------------------------------------------------
// Zoom, position and size are reported to the server, which keeps them in a
// file shared by every session. The browser cannot be asked where to put a
// window when it starts; only the process that launches it can, and only if
// somebody wrote down where the last one was.
let lastReported = "";

function reportView(force) {
  const g = {
    zoom: scale,
    x: Math.round(window.screenX), y: Math.round(window.screenY),
    w: Math.round(window.outerWidth), h: Math.round(window.outerHeight),
  };
  const key = JSON.stringify(g);
  if (!force && key === lastReported) return;
  lastReported = key;
  const q = new URLSearchParams(g).toString();
  fetch("/view?" + q, { cache: "no-store" }).catch(() => {});
}

function applyServerView(view) {
  if (!view || scaleFromServer) return;
  scaleFromServer = true;
  if (typeof view.zoom === "number" && Math.abs(view.zoom - scale) > 0.001) {
    applyScale(view.zoom);
  }
}

window.addEventListener("resize", () => { sizeToViewport(); fit(); });

// -- actions ---------------------------------------------------------------
// The page asks the server to do it; the server owns the device and the lock.
// The button is disabled while it runs, because autoset takes several captures
// and a second click would queue up behind the lock for no reason.
const autosetButton = document.getElementById("autoset");

// A message from a button has to outlive the next poll, which is 400 ms away
// and would otherwise wipe it with the capture's own note before it is read.
const FLASH_MS = 8000;
let flashUntil = 0;

function flash(text) {
  flashUntil = Date.now() + FLASH_MS;
  document.getElementById("capnote").textContent = text;
}

autosetButton.onclick = async () => {
  autosetButton.disabled = true;
  autosetButton.textContent = "Autoset…";
  try {
    const r = await fetch("/control?action=autoset", { method: "POST" });
    const body = await r.json();
    flash(body.ok ? body.steps.join(" · ") : "Autoset misslyckades: " + body.error);
    poll();
  } catch (e) {
    flash("Autoset nådde inte servern.");
  } finally {
    autosetButton.textContent = "Autoset";
    autosetButton.disabled = false;
  }
};

// -- sweep and trigger -----------------------------------------------------
// The buttons are the three positions on a bench scope: Run sweeps whether or
// not the trigger fires, Normal only on a real trigger, Single captures once.
// The server owns the thread that does it; the page only asks.
const sweepButtons = {
  run: document.getElementById("run"),
  normal: document.getElementById("normal"),
  single: document.getElementById("single"),
  stop: document.getElementById("stop"),
};
const slopeButton = document.getElementById("slope");

// What the trigger is set to, as far as the page knows. While a drag is in
// progress the page leads and the server follows; at every other moment the
// server's answer wins, so two surfaces cannot disagree about the level.
let triggerLevel = 0;
let triggerDirection = "rising";
let triggerMode = "auto";
let rangeV = 5;
let dragging = false;

async function control(query, label) {
  try {
    const r = await fetch("/control?" + query, { method: "POST" });
    const body = await r.json();
    if (!body.ok) flash(label + " misslyckades: " + body.error);
    poll();
    return body;
  } catch (e) {
    flash(label + " nådde inte servern.");
    return null;
  }
}

const sweepModes = { run: "auto", normal: "normal", single: "single", stop: "stop" };
for (const [id, mode] of Object.entries(sweepModes)) {
  sweepButtons[id].onclick = () => control("action=sweep&mode=" + mode, "Svep");
}

slopeButton.onclick = () => {
  triggerDirection = triggerDirection === "rising" ? "falling" : "rising";
  sendTrigger();
};

function sendTrigger() {
  return control(
    `action=trigger&level_v=${triggerLevel}&direction=${triggerDirection}&mode=edge`,
    "Trigg"
  );
}

// -- dragging the trigger level -------------------------------------------
// The level is a voltage, the pointer is a pixel. One conversion, used by the
// drawing and the drag alike, so the line cannot end up somewhere other than
// where it was dropped.
const GRAB_PX = 12;

function levelToY(level) {
  return viewH / 2 - (level / rangeV) * (viewH / 2);
}

function yToLevel(y) {
  const level = ((viewH / 2 - y) / (viewH / 2)) * rangeV;
  return Math.max(-rangeV, Math.min(rangeV, level));
}

function pointerY(event) {
  const r = canvas.getBoundingClientRect();
  return (event.clientY - r.top) / scale;
}

canvas.addEventListener("pointerdown", (event) => {
  if (Math.abs(pointerY(event) - levelToY(triggerLevel)) > GRAB_PX) return;
  dragging = true;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
  const near = Math.abs(pointerY(event) - levelToY(triggerLevel)) <= GRAB_PX;
  canvas.style.cursor = dragging || near ? "ns-resize" : "default";
  if (!dragging) return;
  triggerLevel = yToLevel(pointerY(event));
  draw();  // follow the finger; the server hears about it on release
});

canvas.addEventListener("pointerup", (event) => {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  canvas.releasePointerCapture(event.pointerId);
  triggerLevel = yToLevel(pointerY(event));
  // Only on release: a capture per pixel of travel would queue up behind the
  // session lock and the scope would lag the line by seconds.
  sendTrigger().then(() => flash(`Triggnivå ${triggerLevel.toFixed(3)} V`));
});

document.getElementById("zoom-out").onclick = () => { applyScale(scale - SCALE_STEP); reportView(true); };
document.getElementById("zoom-in").onclick = () => { applyScale(scale + SCALE_STEP); reportView(true); };
document.getElementById("zoom-reset").onclick = () => { applyScale(1); reportView(true); };

// -- drawing --------------------------------------------------------------

// Logical drawing size, measured in fit() and reused by draw(). Under CSS zoom
// getBoundingClientRect() and clientWidth do NOT agree — one is scaled by the
// zoom and the other is not — so measuring in one place and drawing with the
// other stretches the trace and pushes its zero line off centre. One source.
let viewW = 0, viewH = 0;

function fit() {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  viewW = r.width / scale;
  viewH = r.height / scale;
  // getBoundingClientRect is in zoomed CSS pixels; multiply the device ratio by
  // the zoom so the backing store matches the physical pixels on screen.
  // rect is already zoom-scaled, so the backing store only needs the device
  // ratio on top of it; the transform then works in unzoomed logical units.
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  const k = dpr * scale;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  draw();
}
// Layout changes at a breakpoint without the window itself resizing, so watch
// the element rather than the window.
new ResizeObserver(fit).observe(document.querySelector(".screenwrap"));

function draw() {
  const w = viewW, h = viewH;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#1c2531";
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID_X; i++) {
    const x = Math.round(w * i / GRID_X) + .5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let i = 1; i < GRID_Y; i++) {
    const y = Math.round(h * i / GRID_Y) + .5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.strokeStyle = "#2a3441";
  ctx.beginPath();
  ctx.moveTo(0, Math.round(h / 2) + .5); ctx.lineTo(w, Math.round(h / 2) + .5);
  ctx.stroke();

  if (!latest || !latest.curve || latest.curve.length < 2) {
    ctx.fillStyle = "#8b98a5";
    ctx.font = "12px 'Segoe UI', sans-serif";
    ctx.fillText("ingen fångst än", 10, 18);
    return;
  }
  // Full scale is the selected range, so the trace sits where it would on the
  // instrument: a signal filling the screen is a signal filling the range.
  const range = latest.measurements.range_v;
  const span = latest.measurements.duration_s || 1;
  ctx.strokeStyle = "#3fe08f";
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  latest.curve.forEach(([t, v], i) => {
    const x = (t / span) * w;
    const y = h / 2 - (v / range) * (h / 2);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  drawTrigger(w, h);
}

function drawTrigger(w, h) {
  // Always drawn, armed or not: dragging this line is how the trigger gets
  // armed in the first place, and a control you cannot see is not a control.
  // Dim in auto mode, so it never claims the scope is waiting for something.
  const armed = triggerMode === "edge";
  const y = levelToY(triggerLevel);
  if (y < -20 || y > h + 20) return;

  ctx.save();
  ctx.globalAlpha = armed ? 1 : 0.45;
  ctx.strokeStyle = dragging ? "#f0a13a" : "#8a6a2a";
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y + .5);
  ctx.lineTo(w, y + .5);
  ctx.stroke();
  ctx.setLineDash([]);

  // The handle is what says "this line can be dragged" — a dashed line alone
  // reads as a measurement annotation.
  ctx.fillStyle = dragging ? "#f0a13a" : "#8a6a2a";
  ctx.beginPath();
  ctx.moveTo(0, y - 6);
  ctx.lineTo(11, y);
  ctx.lineTo(0, y + 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = dragging ? "#f0a13a" : "#8b98a5";
  ctx.font = "11px 'Segoe UI', sans-serif";
  const arrow = triggerDirection === "rising" ? "↑" : "↓";
  const label = armed
    ? `${triggerLevel.toFixed(3)} V ${arrow}`
    : `${triggerLevel.toFixed(3)} V ${arrow} (dra för att trigga)`;
  ctx.fillText(label, 16, y - 4);
  ctx.restore();
}

// -- readouts -------------------------------------------------------------

const fmt = (v, unit, digits = 4) =>
  v === null || v === undefined ? "—" : `${Number(v).toPrecision(digits)} ${unit}`;

function eng(hz) {
  if (hz === null || hz === undefined) return "—";
  if (hz >= 1e6) return (hz / 1e6).toPrecision(5) + " MHz";
  if (hz >= 1e3) return (hz / 1e3).toPrecision(5) + " kHz";
  return hz.toPrecision(5) + " Hz";
}

function readouts(m) {
  // p1 survives every window size, p3 goes first.
  const cells = [
    ["p1", "Vpp", fmt(m.vpp_v, "V")],
    ["p1", "Frekvens", eng(m.frequency_hz)],
    ["p2", "Vmin", fmt(m.vmin_v, "V")],
    ["p2", "Vmax", fmt(m.vmax_v, "V")],
    ["p2", "Medel", fmt(m.mean_v, "V")],
    ["p3", "RMS", fmt(m.rms_v, "V")],
    ["p3", "Duty", m.duty_cycle_pct == null ? "—" : m.duty_cycle_pct.toFixed(1) + " %"],
    ["p3", "Samplingstakt", eng(m.sample_rate_hz).replace("Hz", "S/s")],
  ];
  document.getElementById("readouts").innerHTML = cells
    .map(([p, k, v]) =>
      `<div class="readout ${p}"><div class="k">${k}</div><div class="v">${v}</div></div>`)
    .join("");
}

function rows(el, pairs) {
  document.getElementById(el).innerHTML = pairs
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

// A window whose server has exited shows a scope that no longer exists, and
// there is only one scope. Rather than sit there lying, the page closes itself.
// Ten seconds of silence, not one: a slow reply must not close the display.
const DEAD_AFTER_POLLS = 25;
let failedPolls = 0;

function giveUp() {
  document.title = "PicoScope — stängd";
  // Chromium refuses close() for a window the script did not open, and an
  // Edge --app window is one of those — measured, not assumed. The server
  // closes its own window when it exits; this is what the page can do when the
  // server died without getting the chance: say so, rather than leave a frozen
  // measurement on screen looking like an instrument.
  window.close();
  setTimeout(() => {
    // Built as elements, not as a string of HTML. The string version carried
    // nested quotes, lost its escapes on the way through a generator script,
    // and killed the whole page with a SyntaxError at parse time.
    const wrap = document.createElement("div");
    wrap.setAttribute("style", "display:flex;align-items:center;" +
      "justify-content:center;height:100vh;flex-direction:column;gap:8px;" +
      "color:#8b98a5");
    const head = document.createElement("div");
    head.setAttribute("style", "font-size:15px;color:#e6edf3");
    head.textContent = "Servern är borta";
    const line1 = document.createElement("div");
    line1.textContent = "Den här displayen hörde till en session som avslutats.";
    const line2 = document.createElement("div");
    line2.textContent = "Stäng fönstret — nästa mätning öppnar ett nytt.";
    wrap.append(head, line1, line2);
    document.body.replaceChildren(wrap);
  }, 400);
}

async function poll() {
  let s;
  try {
    s = await (await fetch("/state", { cache: "no-store" })).json();
    failedPolls = 0;
  } catch (e) {
    if (++failedPolls === DEAD_AFTER_POLLS) giveUp();
    return;
  }

  const status = document.getElementById("status");
  if (!s.open) {
    status.textContent = "ingen enhet"; status.className = "pill off";
  } else if (s.simulated) {
    status.textContent = "SIMULERAD"; status.className = "pill sim";
  } else {
    status.textContent = "hårdvara"; status.className = "pill live";
  }
  document.getElementById("device").textContent = s.device
    ? `${s.device.model} · ${s.device.serial}` : "—";
  if (!autosetButton.textContent.endsWith("…")) autosetButton.disabled = !s.open;
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
  document.getElementById("version").textContent = s.version || "—";
  applyServerView(s.view);

  rows("channel", [
    ["Område", s.channel ? "±" + s.channel.range_v + " V" : "—"],
    ["Koppling", s.channel ? s.channel.coupling : "—"],
    ["På", s.channel && s.channel.enabled ? "ja" : "nej"],
  ]);
  rows("trigger", [
    ["Läge", s.trigger ? s.trigger.mode : "—"],
    ["Nivå", s.trigger ? s.trigger.threshold_v + " V" : "—"],
    ["Flank", s.trigger ? s.trigger.direction : "—"],
    ["Auto", s.trigger ? s.trigger.auto_trigger_ms + " ms" : "—"],
    ["Svep", s.sweep && s.sweep.running ? s.sweep.mode : "stoppat"],
  ]);

  // The server's settings win — except mid-drag, when the finger leads.
  if (s.trigger && !dragging) {
    triggerLevel = s.trigger.threshold_v;
    triggerDirection = s.trigger.direction;
    triggerMode = s.trigger.mode;
    slopeButton.textContent = triggerDirection === "rising" ? "↑" : "↓";
  }
  if (s.channel) rangeV = s.channel.range_v;

  const sweeping = s.sweep && s.sweep.running ? s.sweep.mode : "stop";
  for (const [id, mode] of Object.entries(sweepModes)) {
    sweepButtons[id].classList.toggle("on", mode === sweeping);
    sweepButtons[id].disabled = !s.open;
  }
  slopeButton.disabled = !s.open;
  // A trigger that never fires is a state, not a fault — say so where the
  // sweep mode is shown rather than hiding it in a log.
  if (s.sweep && s.sweep.error && Date.now() > flashUntil) {
    document.getElementById("capnote").textContent = s.sweep.error;
  }

  const act = document.getElementById("activity");
  act.innerHTML = (s.activity && s.activity.length)
    ? s.activity.map(a =>
        `<li class="${a.status === 'fel' ? 'err' : ''}">` +
        `<span class="t">${a.time}</span><span class="n">${a.tool}</span>` +
        `<span class="t">${a.status}</span></li>`).join("")
    : '<li class="empty">väntar på anrop…</li>';

  if (s.latest) {
    latest = s.latest;
    const m = s.latest.measurements;
    readouts(m);
    const perDiv = m.duration_s / GRID_X;
    document.getElementById("divs").textContent =
      `${(m.range_v / (GRID_Y / 2)).toPrecision(3)} V/div · ` +
      `${(perDiv * 1e3).toPrecision(3)} ms/div · ${m.samples} sampel · ` +
      `${s.latest.capture_id}`;
    if (Date.now() > flashUntil) {
      document.getElementById("capnote").textContent = m.note || "";
    }
    draw();
  }
}

applyScale(readScale());
poll();
setInterval(poll, 400);
// The window can be moved or resized without any event firing that we can see
// from inside it, so the geometry is sampled — but only sent when it changed.
setInterval(reportView, 1000);
window.addEventListener("beforeunload", () => reportView(true));
</script>
</body>
</html>
