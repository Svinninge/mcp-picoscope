[project]
name = "mcp-picoscope"
version = "0.1.0"
description = "MCP server exposing a PicoScope PS2104 USB oscilloscope as tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Real hardware. Requires a separately installed 64-bit PicoSDK (ps2000.dll).
hardware = ["picosdk"]
# Only to build PicoScope.exe (packaging/build_exe.py); not needed to run.
build = ["pyinstaller"]

[project.scripts]
mcp-picoscope = "mcp_picoscope.server:main"

# The desktop app: owns the scope, shows the display, serves MCP over HTTP.
[project.gui-scripts]
picoscope-app = "mcp_picoscope.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_picoscope*"]

[tool.setuptools.package-data]
mcp_picoscope = ["ui.html"]
